name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  GITHUB_REPO_IDENTITY: AcesStarLord/Affected-Zzs-apk

jobs:
  build-apk:
    name: Build Android Debug APK (AcesStarLord/Affected-Zzs-apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Web Dependencies & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Prepare Android Project (Capacitor) if not present
        run: |
          if [ ! -f "android/gradlew" ]; then
            npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
            npx cap add android
          fi
          npx cap sync android

      - name: Grant Execute Permission for Gradlew
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare APK Artifacts for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ./app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk ./Affected-Zzs-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            ./app-debug.apk
            ./Affected-Zzs-debug.apk

      - name: Publish Debug APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: AcesStarLord/Affected-Zzs-apk
          tag_name: latest
          name: Latest Debug APK Build (AcesStarLord/Affected-Zzs-apk)
          body: |
            Automated Android Debug APK build for **Affected Zzs - Substance & Sleep Biometrics** (`AcesStarLord/Affected-Zzs-apk`).

            ### Direct APK Download Links
            - **Direct APK (`app-debug.apk`):** https://github.com/AcesStarLord/Affected-Zzs-apk/releases/latest/download/app-debug.apk
            - **Direct APK (`Affected-Zzs-debug.apk`):** https://github.com/AcesStarLord/Affected-Zzs-apk/releases/latest/download/Affected-Zzs-debug.apk
          files: |
            ./app-debug.apk
            ./Affected-Zzs-debug.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write Direct APK Download Summary
        run: |
          echo "### Android Debug APK Ready for AcesStarLord/Affected-Zzs-apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download (app-debug.apk):** https://github.com/AcesStarLord/Affected-Zzs-apk/releases/latest/download/app-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct Download (Affected-Zzs-debug.apk):** https://github.com/AcesStarLord/Affected-Zzs-apk/releases/latest/download/Affected-Zzs-debug.apk" >> $GITHUB_STEP_SUMMARY
          echo "- **Releases Page:** https://github.com/AcesStarLord/Affected-Zzs-apk/releases" >> $GITHUB_STEP_SUMMARY
